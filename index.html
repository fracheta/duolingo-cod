<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOwl - Aprenda Código 🦉</title>
    <style>
        :root {
            --green: #58CC02;
            --green-dark: #46A302;
            --green-light: #89E219;
            --blue: #1CB0F6;
            --orange: #FF9600;
            --red: #FF4B4B;
            --purple: #A568F0;
            --bg: #f0f4f8;
            --card: #fff;
            --text: #3c3c3c;
            --text-light: #777;
            --shadow: 0 6px 0 #e0e0e0;
            --shadow-hover: 0 8px 0 #c8d8c0;
            --radius: 20px;
            --font: 'Segoe UI', 'Nunito', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            background-image:
                radial-gradient(circle at 10% 20%, #e8f5e9 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, #e3f2fd 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #ffffff 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1), 0 10px 25px rgba(0, 0, 0, 0.06);
            padding: 24px 22px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
            overflow: hidden;
            animation: fadeSlideIn 0.5s ease;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-14px);
            }
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.07);
            }
        }
        @keyframes bounceIn {
            0% {
                transform: scale(0.4);
                opacity: 0;
            }
            60% {
                transform: scale(1.1);
            }
            80% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Cabeçalho */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mascot {
            font-size: 42px;
            cursor: pointer;
            transition: transform 0.2s;
            animation: float 3s ease-in-out infinite;
            line-height: 1;
        }
        .mascot:active {
            transform: scale(0.85);
        }
        .title {
            font-size: 1.7em;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .title span {
            color: var(--green);
        }
        .xp-badge {
            background: #fffbe6;
            border: 2.5px solid #f0c800;
            border-radius: 30px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.9em;
            color: #b38800;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 3px 0 #e6c800;
        }

        /* Mensagem motivacional */
        .motivation {
            text-align: center;
            font-size: 0.95em;
            color: var(--text-light);
            background: #fafafa;
            border-radius: 14px;
            padding: 10px 16px;
            margin-bottom: 4px;
            border: 1.5px dashed #e0e0e0;
        }

        /* Trilha de níveis */
        .path-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .path-grid::-webkit-scrollbar {
            width: 5px;
        }
        .path-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .path-grid::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 10px;
        }

        .lesson-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fff;
            border: 2.5px solid #eaeaea;
            border-radius: var(--radius);
            padding: 16px 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 0 #e6e6e6;
            text-decoration: none;
            color: inherit;
            position: relative;
        }
        .lesson-card:hover {
            border-color: #c8e0b8;
            box-shadow: 0 7px 0 #c0d4b0;
            transform: translateY(-3px);
        }
        .lesson-card:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d0d0d0;
        }
        .lesson-card.completed {
            border-color: #b8e898;
            background: #f9fff6;
        }
        .lesson-card.completed .lesson-number {
            background: #e0f5d0;
            color: #3a7a1a;
        }
        .lesson-number {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1em;
            color: #666;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .lesson-info {
            flex: 1;
        }
        .lesson-info h3 {
            font-size: 1.05em;
            font-weight: 700;
            color: var(--text);
            margin: 0;
        }
        .lesson-info p {
            font-size: 0.8em;
            color: #999;
            margin: 2px 0 0;
        }
        .lesson-badge {
            font-size: 1.5em;
            transition: transform 0.3s;
        }
        .lesson-card:hover .lesson-badge {
            transform: scale(1.2);
        }

        /* Rodapé */
        .footer {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }
        .btn {
            border: none;
            cursor: pointer;
            font-family: var(--font);
            font-weight: 700;
            font-size: 0.85em;
            padding: 10px 20px;
            border-radius: 30px;
            transition: all 0.15s ease;
            background: #fff;
            border: 2px solid #e0e0e0;
            box-shadow: 0 3px 0 #d0d0d0;
            color: #666;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover {
            background: #f5f5f5;
            box-shadow: 0 4px 0 #c8c8c8;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #d0d0d0;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9em;
            z-index: 100;
            pointer-events: none;
            animation: bounceIn 0.4s ease;
            white-space: nowrap;
        }

        /* Responsivo */
        @media (max-width: 450px) {
            .app {
                padding: 18px 14px 22px;
                border-radius: 22px;
            }
            .title {
                font-size: 1.3em;
            }
            .mascot {
                font-size: 34px;
            }
            .lesson-card {
                padding: 12px 14px;
                gap: 10px;
            }
            .lesson-number {
                width: 40px;
                height: 40px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- Toast -->
        <div class="toast" id="toast" style="display:none;"></div>

        <!-- Cabeçalho -->
        <div class="header">
            <div class="logo">
                <span class="mascot" id="mascot" title="Clique na coruja!">🦉</span>
                <h1 class="title">Code<span>Owl</span></h1>
            </div>
            <div class="xp-badge">⭐ <span id="totalXP">0</span> XP</div>
        </div>

        <!-- Mensagem -->
        <div class="motivation" id="motivationMessage">
            🚀 Escolha uma lição e continue sua jornada de código!
        </div>

        <!-- Trilha de níveis -->
        <div class="path-grid" id="pathGrid">
            <!-- As lições serão geradas dinamicamente -->
        </div>

        <!-- Rodapé -->
        <div class="footer">
            <button class="btn" onclick="resetProgress()">🔄 Reiniciar Progresso</button>
            <button class="btn" onclick="playHoot()">🦉 Som da Coruja</button>
        </div>
    </div>

    <script>
        (function() {
            // ============ CONFIGURAÇÃO DAS LIÇÕES ============
            // Cada lição aponta para um arquivo HTML (ex: 10.html, 20.html...)
            const lessonFiles = [
                { file: '10.html', title: 'HTML Fundamentos', desc: 'Tags, estrutura e semântica', icon: '🏷️',
                    xp: 30 },
                { file: '20.html', title: 'CSS Seletores & Estilos', desc: 'Classes, IDs e propriedades', icon: '🎨',
                    xp: 35 },
                { file: '30.html', title: 'JavaScript Essencial', desc: 'Variáveis, funções e console', icon: '⚡',
                    xp: 40 },
                { file: '40.html', title: 'Layout com Flexbox', desc: 'Posicionamento moderno com CSS', icon: '📦',
                    xp: 40 },
                { file: '50.html', title: 'Manipulação do DOM', desc: 'JS interagindo com HTML', icon: '🖱️', xp: 45 },
                { file: '60.html', title: 'Desafio Final de Código', desc: 'Mistura tudo que aprendeu!', icon: '🏆',
                    xp: 50 },
            ];

            // ============ ESTADO E LOCAL STORAGE ============
            const STORAGE_KEY_COMPLETED = 'codeowl_completed_lessons'; // chave -> true
            const STORAGE_KEY_XP = 'codeowl_total_xp';

            function getCompletedLessons() {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY_COMPLETED)) || {};
                } catch (e) {
                    return {};
                }
            }

            function getTotalXP() {
                try {
                    return parseInt(localStorage.getItem(STORAGE_KEY_XP), 10) || 0;
                } catch (e) {
                    return 0;
                }
            }

            function setTotalXP(value) {
                localStorage.setItem(STORAGE_KEY_XP, value);
            }

            function markLessonCompleted(fileName, xpGain) {
                const completed = getCompletedLessons();
                if (!completed[fileName]) {
                    completed[fileName] = true;
                    localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(completed));
                    const currentXP = getTotalXP();
                    setTotalXP(currentXP + xpGain);
                    return true; // indica que foi recém-completada
                }
                return false;
            }

            // ============ RENDERIZAR TRILHA ============
            const pathGrid = document.getElementById('pathGrid');
            const totalXPSpan = document.getElementById('totalXP');
            const motivationMsg = document.getElementById('motivationMessage');
            const toast = document.getElementById('toast');
            let toastTimeout;

            function showToast(msg, duration = 2000) {
                toast.textContent = msg;
                toast.style.display = 'block';
                toast.classList.remove('bounceIn');
                void toast.offsetWidth;
                toast.classList.add('bounceIn');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.style.display = 'none';
                }, duration);
            }

            function updateUI() {
                const completedLessons = getCompletedLessons();
                const totalXP = getTotalXP();
                totalXPSpan.textContent = totalXP;

                // Mensagem motivacional baseada no progresso
                const completedCount = Object.keys(completedLessons).length;
                const totalCount = lessonFiles.length;
                if (completedCount === 0) {
                    motivationMsg.textContent = '🐣 Comece pelo nível 10 e aprenda HTML!';
                } else if (completedCount === totalCount) {
                    motivationMsg.textContent = '🎉 Uau! Você concluiu todas as lições! Você é um(a) mestre do código!';
                } else {
                    motivationMsg.textContent = `🔥 Você já completou ${completedCount} de ${totalCount} lições. Continue assim!`;
                }

                // Construir cards
                pathGrid.innerHTML = '';
                lessonFiles.forEach((lesson, index) => {
                    const isCompleted = completedLessons[lesson.file] === true;
                    // Bloquear lições futuras se a anterior não foi completada (opcional)
                    const previousFile = index > 0 ? lessonFiles[index - 1].file : null;
                    const isLocked = index > 0 && !completedLessons[previousFile];

                    const card = document.createElement('a');
                    card.className = 'lesson-card';
                    if (isCompleted) card.classList.add('completed');
                    if (isLocked) {
                        card.classList.add('locked');
                        card.style.opacity = '0.5';
                        card.style.pointerEvents = 'none';
                        card.style.cursor = 'not-allowed';
                    } else {
                        card.href = lesson.file;
                        // Ao clicar, não precisa de evento extra; o link funciona normalmente.
                    }

                    card.innerHTML = `
                <div class="lesson-number">${(index + 1) * 10}</div>
                <div class="lesson-info">
                  <h3>${lesson.icon} ${lesson.title}</h3>
                  <p>${lesson.desc} • +${lesson.xp} XP</p>
                </div>
                <div class="lesson-badge">${isCompleted ? '✅' : (isLocked ? '🔒' : '▶️')}</div>
              `;
                    pathGrid.appendChild(card);
                });
            }

            // ============ VERIFICAR SE VEIO DE UMA LIÇÃO CONCLUÍDA ============
            function checkReturnFromLesson() {
                const urlParams = new URLSearchParams(window.location.search);
                const justCompleted = urlParams.get('completed');
                const xpGained = parseInt(urlParams.get('xp'), 10);
                if (justCompleted && xpGained) {
                    const fileName = justCompleted + '.html';
                    const wasNew = markLessonCompleted(fileName, xpGained);
                    if (wasNew) {
                        showToast(`🎉 Lição concluída! +${xpGained} XP`);
                        // Limpar parâmetros da URL sem recarregar
                        if (window.history && window.history.replaceState) {
                            const cleanUrl = window.location.pathname;
                            window.history.replaceState({}, document.title, cleanUrl);
                        }
                    }
                    updateUI();
                }
            }

            // ============ INTERAÇÕES ============
            function playHoot() {
                // Som simples com Web Audio API
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, ctx.currentTime);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.3);
                    setTimeout(() => {
                        const osc2 = ctx.createOscillator();
                        const gain2 = ctx.createGain();
                        osc2.type = 'sine';
                        osc2.frequency.setValueAtTime(440, ctx.currentTime);
                        gain2.gain.setValueAtTime(0.1, ctx.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                        osc2.connect(gain2);
                        gain2.connect(ctx.destination);
                        osc2.start(ctx.currentTime);
                        osc2.stop(ctx.currentTime + 0.35);
                    }, 180);
                } catch (e) { /* silencioso */ }
                showToast('🦉 Huu-huu! Continue codando!');
            }

            function resetProgress() {
                if (confirm('Tem certeza que deseja apagar todo o seu progresso? Isso não pode ser desfeito.')) {
                    localStorage.removeItem(STORAGE_KEY_COMPLETED);
                    localStorage.removeItem(STORAGE_KEY_XP);
                    updateUI();
                    showToast('🔄 Progresso reiniciado!');
                }
            }

            // Mascote interativo
            document.getElementById('mascot').addEventListener('click', playHoot);

            // Expor funções globais
            window.resetProgress = resetProgress;
            window.playHoot = playHoot;

            // ============ INICIALIZAÇÃO ============
            checkReturnFromLesson();
            updateUI();

            console.log('🦉 CodeOwl Hub pronto! Escolha uma lição para começar.');
        })();
    </script>
</body>
</html>
